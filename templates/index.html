<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube MP3 변환기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>YouTube 영상 MP3로 변환하기</h1>
        <p>아래에 YouTube 영상 링크를 붙여넣고 변환 버튼을 누르세요.</p>
        
        <form id="download-form">
            <input type="text" id="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required>
            <button type="submit">변환 및 다운로드</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        // [기능 1] 유튜브 링크 표준화 함수 (youtu.be, shorts 등 모두 watch?v= 형태로 통일)
        function getStandardYoutubeUrl(url) {
            try {
                const urlObj = new URL(url);
                let videoId = '';

                if (urlObj.hostname === 'youtu.be') {
                    videoId = urlObj.pathname.slice(1);
                } else if (urlObj.pathname.includes('/shorts/')) {
                    videoId = urlObj.pathname.split('/shorts/')[1];
                } else {
                    const params = new URLSearchParams(urlObj.search);
                    videoId = params.get('v');
                }

                if (!videoId) return null;
                return `https://www.youtube.com/watch?v=${videoId}`;
            } catch (e) {
                return null;
            }
        }

        // [기능 2] 서버 요청 및 재시도 로직 (실패 시 2초 대기 후 재시도)
        async function fetchWithRetry(url, options, retries = 3) {
            try {
                const response = await fetch(url, options);
                
                // 성공(200~299)이면 바로 반환
                if (response.ok) {
                    return response;
                }

                // 서버 에러(500대)이고 남은 기회가 있다면 재시도
                if (retries > 0 && response.status >= 500) {
                    console.warn(`서버 에러(${response.status}) 발생. 2초 후 재시도합니다... (남은 기회: ${retries})`);
                    document.getElementById('status').textContent = `서버 연결 지연 중... 재시도합니다. (${retries})`;
                    
                    await new Promise(resolve => setTimeout(resolve, 2000)); // 2초 대기
                    return fetchWithRetry(url, options, retries - 1);
                }

                return response; // 재시도 기회가 없거나 400대 에러면 그대로 반환

            } catch (error) {
                // 네트워크 에러 등으로 아예 요청이 실패한 경우
                if (retries > 0) {
                    console.warn(`네트워크 오류 발생. 2초 후 재시도합니다... (남은 기회: ${retries})`);
                    document.getElementById('status').textContent = `네트워크 불안정... 재시도합니다. (${retries})`;
                    
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    return fetchWithRetry(url, options, retries - 1);
                }
                throw error;
            }
        }

        document.getElementById('download-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const rawUrl = document.getElementById('url').value;
            const statusDiv = document.getElementById('status');
            const submitButton = this.querySelector('button');

            // 1. 링크 검사 및 표준화
            const cleanUrl = getStandardYoutubeUrl(rawUrl);
            if (!cleanUrl) {
                statusDiv.textContent = '올바른 YouTube 링크가 아닙니다. 링크를 확인해주세요.';
                statusDiv.style.color = 'red';
                return;
            }

            statusDiv.textContent = '서버에서 변환 중입니다. 잠시만 기다려주세요...';
            statusDiv.style.color = '#333';
            submitButton.disabled = true;
            submitButton.textContent = '변환 중...';

            try {
                // 2. 재시도 로직이 포함된 함수로 요청 보내기
                const response = await fetchWithRetry('/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: cleanUrl }) // 표준화된 주소 전송
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const filename = 'audio.mp3';

                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    statusDiv.textContent = '변환이 완료되었습니다!';
                    statusDiv.style.color = 'green';
                } else {
                    // 에러 응답 처리 (HTML이 올 수도 있으므로 텍스트로 먼저 받음)
                    const errorText = await response.text();
                    let errorMessage = '알 수 없는 오류';
                    
                    try {
                        const errorJson = JSON.parse(errorText);
                        errorMessage = errorJson.error;
                    } catch(e) {
                        // JSON 파싱 실패 시 (서버가 HTML 에러 페이지를 준 경우 등)
                        errorMessage = `서버 응답 오류 (${response.status})`;
                    }
                    
                    statusDiv.textContent = `변환 실패: ${errorMessage}`;
                    statusDiv.style.color = 'red';
                }
            } catch (error) {
                console.error('Download failed:', error);
                statusDiv.textContent = '서버와 연결할 수 없습니다. 잠시 후 다시 시도해주세요.';
                statusDiv.style.color = 'red';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = '변환 및 다운로드';
            }
        });
    </script>
</body>
</html>
