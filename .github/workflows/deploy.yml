name: Deploy to Oracle Cloud (Fast Sync)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/youtube-downloader"
          rm: false 

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/youtube-downloader
            
            # 1. 의존성만 빠르게 업데이트
            source venv/bin/activate
            pip install -r requirements.txt

            # 2. 민감 정보 파일 동적 생성 (GitHub Secrets 주입)
            echo "${{ secrets.COOKIES_CONTENT }}" > cookies.txt
            echo '${{ secrets.SERVICE_CONTENT }}' | sudo tee /etc/systemd/system/youtube.service

            # 3. 서비스 재시작
            sudo systemctl daemon-reload
            sudo systemctl restart youtube